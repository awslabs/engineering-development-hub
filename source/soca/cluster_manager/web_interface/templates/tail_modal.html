{# Tail modal. Includes tail_viewer.html as the body. #}

<div class="modal fade" id="tailModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="fas fa-eye"></i>
          {{ _("Live file tail") }}
        </h5>
    
        <button type="button" class="close"
            data-bs-dismiss="modal"
            aria-label="{{ _("Close") }}" onclick="closeTailModal()" >
            <span aria-hidden="true">{{ _("&times;") }}</span>
         </button>

      </div>

      <div class="modal-body p-0 d-flex flex-column"
           style="height: 65vh; min-height: 400px;">
        {% include 'tail_viewer.html' %}
      </div>

      <div class="modal-footer py-2">
        <small class="text-muted me-auto">
          {{ _("Stream auto-closes after idle/max-duration. Use Pop out for long watches.") }}
        </small>
        <button type="button" class="btn btn-secondary btn-sm"
                data-bs-dismiss="modal" onclick="closeTailModal()">
          {{ _("Close") }}
        </button>
      </div>
    </div>
  </div>
</div>
